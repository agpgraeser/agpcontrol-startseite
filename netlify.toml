# Netlify-Build-Konfiguration – Startseite agpcontrol.com
# Reine statische HTML-Seiten, kein Build. Deploy automatisch bei 'git push'.

[build]
  publish = "."   # Projektwurzel wird direkt veröffentlicht

# Web-App-Manifest der HdT-Kursseite mit korrektem Typ ausliefern
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
