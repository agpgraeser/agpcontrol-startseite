# Netlify-Build-Konfiguration – Startseite agpcontrol.com
# Reine statische HTML-Seiten, kein Build. Deploy automatisch bei 'git push'.

[build]
  publish = "."   # Projektwurzel wird direkt veröffentlicht

# AGP_H-Werkzeugseite gesperrt (2026-11-19, Axel): /hdt führt auf die
# Startseite. force = true, weil Netlify sonst die vorhandene hdt.html
# ausliefert. Zum Freischalten beide Blöcke löschen.
[[redirects]]
  from = "/hdt"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/hdt.html"
  to = "/"
  status = 302
  force = true

# Freigabe der AGP_S-Werkzeugseite für einzelne Teilnehmer (2026-11-27, Axel):
# nicht verlinkte Adresse, liefert siemens.html aus (Rewrite, Adresse bleibt
# stehen). Muss VOR der Sperre von /siemens.html stehen. Zum Zurückziehen
# diesen Block löschen bzw. den Code wechseln.
[[redirects]]
  from = "/s-wmokey7x"
  to = "/siemens.html"
  status = 200
  force = true

[[headers]]
  for = "/s-wmokey7x"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Ebenso gesperrt (2026-11-19): AGP_S-Werkzeugseite und Werkzeugseite
# Vibe Coding. Die Kursbeschreibung vibecoding-kurs.html bleibt offen.
[[redirects]]
  from = "/siemens"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/siemens.html"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/vibecoding"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/vibecoding.html"
  to = "/"
  status = 302
  force = true

# Web-App-Manifest der HdT-Kursseite mit korrektem Typ ausliefern
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
